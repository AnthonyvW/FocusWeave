[package]
name = "focusweave-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for FocusWeave"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
focusweave-core.workspace = true
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"
mimalloc = { version = "0.1.52", default-features = false }

[features]
default = []
# Build against the OpenCV C++ library instead of this project's own kernels.
opencv-backend = ["focusweave-core/opencv-backend"]
