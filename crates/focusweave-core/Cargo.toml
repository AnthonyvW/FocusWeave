[package]
name = "focusweave-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Focus stacking via Laplacian pyramid fusion (core library)"

[dependencies]
image.workspace = true
# Only core and imgproc are used; registration is implemented in this crate,
# so opencv_video and everything it drags in stay out of the link.
opencv = { version = "0.100", default-features = false, features = ["imgproc"] }
rayon.workspace = true
rustfft.workspace = true
