[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "focusweave"
version = "2.0.0rc1"
description = "Focus stacking via Laplacian pyramid fusion"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/AnthonyvW/FocusWeave"

[project.scripts]
focusweave = "focusweave.main:main"

[tool.maturin]
manifest-path = "crates/focusweave-py/Cargo.toml"
module-name = "focusweave._core"
python-source = "python"
features = ["pyo3/extension-module"]
