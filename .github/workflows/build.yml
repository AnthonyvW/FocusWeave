name: Build

on:
  release:
    types: [published]
  push:
    branches: [main, rust]
  pull_request:
  workflow_dispatch:

env:
  OPENCV_VERSION: "4.10.0"

jobs:
  # Populates the OpenCV cache once per platform so the six jobs below restore
  # it rather than each building their own copy.
  opencv:
    name: OpenCV (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-opencv
        with:
          version: ${{ env.OPENCV_VERSION }}

  check:
    needs: opencv
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-opencv
        with:
          version: ${{ env.OPENCV_VERSION }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  compare:
    name: Compare against the reference implementation
    needs: opencv
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-opencv
        with:
          version: ${{ env.OPENCV_VERSION }}
      - run: pip install -r tests/requirements.txt maturin
      - run: cargo build --release -p focusweave-cli
      - run: maturin build --release --out dist
      - run: pip install --find-links dist --force-reinstall focusweave
      - run: python tests/run_all.py

  binaries:
    name: Binary (${{ matrix.os }})
    needs: opencv
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: FocusWeave-linux
          - os: windows-latest
            archive: FocusWeave-windows
          - os: macos-latest
            archive: FocusWeave-macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-opencv
        id: opencv
        with:
          version: ${{ env.OPENCV_VERSION }}

      - run: cargo build --release -p focusweave-cli

      # OpenCV is linked dynamically, so a bare executable will not start on a
      # machine without it. Each archive carries the two libraries beside the
      # binary; it is only two because the OpenCV built above has no LAPACK,
      # OpenBLAS or GL behind it.
      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          python ci/bundle_elf.py target/release/focusweave "${{ matrix.archive }}" \
            --search "${{ steps.opencv.outputs.lib-dir }}"

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "${{ matrix.archive }}"
          cp target/release/focusweave "${{ matrix.archive }}/"
          # -a to keep the symlinks: each library installs as one real file and
          # two links, and a dereferencing copy would triple the archive.
          cp -a "${{ steps.opencv.outputs.lib-dir }}"/libopencv_*.dylib "${{ matrix.archive }}/"

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ matrix.archive }}" | Out-Null
          Copy-Item target\release\focusweave.exe "${{ matrix.archive }}\"
          Copy-Item "${{ steps.opencv.outputs.lib-dir }}\opencv_*.dll" "${{ matrix.archive }}\"

      # The OpenCV install is moved out of the way first, and the bundle run
      # from a directory the build never touched. Without that, the rpath
      # pointing at the build machine's OpenCV resolves and the test passes on
      # an archive containing no libraries at all -- which is exactly what it
      # did before this step hid it. pillow writes the frames; nothing here
      # provides OpenCV.
      - name: Smoke test
        shell: bash
        run: |
          trap 'mv "$HOME/opencv-hidden" "$HOME/opencv-min" 2>/dev/null || true' EXIT
          mv "$HOME/opencv-min" "$HOME/opencv-hidden"
          [ "$RUNNER_OS" = "Windows" ] && exe=".exe" || exe=""
          pip install numpy pillow
          python ci/make_smoke_stack.py smoke-frames
          mv "${{ matrix.archive }}" "$HOME/bundle-under-test"
          "$HOME/bundle-under-test/focusweave$exe" smoke-frames --output smoke.png
          python -c "
          from PIL import Image
          im = Image.open('smoke.png')
          assert im.size[0] >= 320 and im.size[1] >= 240, im.size
          print('stacked', im.size, im.mode)
          "
          mv "$HOME/bundle-under-test" "${{ matrix.archive }}"
          du -sh "${{ matrix.archive }}"

      - name: Archive
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${{ matrix.archive }}.zip" "${{ matrix.archive }}"
          else
            tar czf "${{ matrix.archive }}.tar.gz" "${{ matrix.archive }}"
          fi
          ls -l ${{ matrix.archive }}.*

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.zip
            ${{ matrix.archive }}.tar.gz
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            ${{ matrix.archive }}.zip
            ${{ matrix.archive }}.tar.gz

  wheels:
    name: Wheel (${{ matrix.os }})
    needs: opencv
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-opencv
        id: opencv
        with:
          version: ${{ env.OPENCV_VERSION }}

      - run: pip install maturin

      # No manylinux container: it has no OpenCV. The Linux wheel is therefore
      # tagged for the runner's glibc rather than being broadly portable.
      - run: maturin build --release --out dist

      # maturin repairs the Linux wheel itself. It leaves the macOS one alone
      # -- it produced a 1.3 MB wheel with no dylibs in it -- so delocate does
      # that, and delvewheel the Windows DLLs.
      - name: Repair (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install delocate
          delocate-wheel -w repaired -v dist/*.whl
          rm -rf dist && mv repaired dist

      - name: Repair (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pip install delvewheel
          delvewheel repair --add-path "${{ steps.opencv.outputs.lib-dir }}" -w repaired dist/*.whl
          rm -rf dist && mv repaired dist

      # The OpenCV install is moved out of the way first, so the only copy of
      # it left is whatever the wheel carries. Without that the extension's
      # rpath finds the build machine's copy and the test passes on a wheel
      # that would not import anywhere else.
      - name: Smoke test
        shell: bash
        run: |
          trap 'mv "$HOME/opencv-hidden" "$HOME/opencv-min" 2>/dev/null || true' EXIT
          mv "$HOME/opencv-min" "$HOME/opencv-hidden"
          python -m venv "$HOME/clean"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$HOME/clean/Scripts"; exe=".exe"; else bin="$HOME/clean/bin"; exe=""; fi
          "$bin/pip" install numpy pillow
          # --no-index so the wheel under test is the one installed, never a
          # release from PyPI; its dependencies are already in place above.
          "$bin/pip" install --no-index --find-links dist focusweave
          "$bin/python" ci/make_smoke_stack.py smoke-frames
          "$bin/python" -c "
          from pathlib import Path
          from focusweave import FocusStackConfig, run
          result = run(FocusStackConfig(images=Path('smoke-frames')))
          print('api ok', result.image.shape, result.image.dtype)
          "
          "$bin/focusweave$exe" smoke-frames --output cli.png
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: dist
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/*
