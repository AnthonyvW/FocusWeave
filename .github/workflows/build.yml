name: Build

on:
  release:
    types: [published]
  push:
    branches: [main, rust]
  pull_request:
  workflow_dispatch:

env:
  # Chocolatey's OpenCV package; the version is pinned so the link libraries
  # below keep matching it.
  OPENCV_VERSION: "4.10.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev libclang-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  compare:
    name: Compare against the reference implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev libclang-dev patchelf
      - run: pip install -r tests/requirements.txt maturin
      - run: cargo build --release -p focusweave-cli
      - run: maturin build --release --out dist
      - run: pip install --find-links dist --force-reinstall focusweave
      - run: python tests/run_all.py

  binaries:
    name: Binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: FocusWeave-linux
            built: target/release/focusweave
            release_name: FocusWeave-linux
          - os: windows-latest
            artifact: FocusWeave-windows
            built: target/release/focusweave.exe
            release_name: FocusWeave-windows.exe
          - os: macos-latest
            artifact: FocusWeave-macos
            built: target/release/focusweave
            release_name: FocusWeave-macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenCV (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev libclang-dev
      - name: Install OpenCV (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv llvm
      - name: Install OpenCV (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress -y llvm opencv --version=$env:OPENCV_VERSION
          $v = $env:OPENCV_VERSION -replace '\.', '' -replace '0$', ''
          "OPENCV_INCLUDE_PATHS=C:\tools\opencv\build\include"      >> $env:GITHUB_ENV
          "OPENCV_LINK_PATHS=C:\tools\opencv\build\x64\vc16\lib"    >> $env:GITHUB_ENV
          "OPENCV_LINK_LIBS=opencv_world$v"                         >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin"                 >> $env:GITHUB_ENV
          # The build script loads libclang.dll, so LLVM must be on PATH too.
          "C:\Program Files\LLVM\bin"                               >> $env:GITHUB_PATH
          "C:\tools\opencv\build\x64\vc16\bin"                      >> $env:GITHUB_PATH
      - run: cargo build --release -p focusweave-cli
      - name: Name the artifact for release
        shell: bash
        run: |
          mkdir -p upload
          cp "${{ matrix.built }}" "upload/${{ matrix.release_name }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: upload/${{ matrix.release_name }}
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: upload/${{ matrix.release_name }}

  wheels:
    name: Wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenCV (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev libclang-dev patchelf
      - name: Install OpenCV (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv llvm
      - name: Install OpenCV (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress -y llvm opencv --version=$env:OPENCV_VERSION
          $v = $env:OPENCV_VERSION -replace '\.', '' -replace '0$', ''
          "OPENCV_INCLUDE_PATHS=C:\tools\opencv\build\include"      >> $env:GITHUB_ENV
          "OPENCV_LINK_PATHS=C:\tools\opencv\build\x64\vc16\lib"    >> $env:GITHUB_ENV
          "OPENCV_LINK_LIBS=opencv_world$v"                         >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin"                 >> $env:GITHUB_ENV
          "C:\Program Files\LLVM\bin"                               >> $env:GITHUB_PATH
          "C:\tools\opencv\build\x64\vc16\bin"                      >> $env:GITHUB_PATH
      # `container: off` builds against the runner's own OpenCV rather than in a
      # manylinux image, which has none. The Linux wheel is therefore tagged
      # linux_x86_64, not manylinux; publishing a portable one means building a
      # trimmed OpenCV inside the manylinux container first.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          container: off
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: dist
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/*
