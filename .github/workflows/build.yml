name: Build

on:
  release:
    types: [published]
  push:
    branches: [main, rust]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/setup-opencv
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  compare:
    name: Compare against the reference implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-opencv
      - run: pip install -r tests/requirements.txt maturin
      - run: cargo build --release -p focusweave-cli
      - run: maturin build --release --out dist
      - run: pip install --find-links dist --force-reinstall focusweave
      - run: python tests/run_all.py

  binaries:
    name: Binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: FocusWeave-linux
          - os: windows-latest
            archive: FocusWeave-windows
          - os: macos-latest
            archive: FocusWeave-macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-opencv
        id: opencv

      - run: cargo build --release -p focusweave-cli

      # OpenCV is linked dynamically, so a bare executable will not start on a
      # machine that does not already have it. Each archive carries the
      # libraries next to the binary, with the loader pointed at that directory.
      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: python ci/bundle_elf.py target/release/focusweave "${{ matrix.archive }}"

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install dylibbundler
          mkdir -p "${{ matrix.archive }}"
          cp target/release/focusweave "${{ matrix.archive }}/"
          dylibbundler --overwrite-files --bundle-deps --create-dir \
            --fix-file "${{ matrix.archive }}/focusweave" \
            --dest-dir "${{ matrix.archive }}/libs" \
            --install-path "@executable_path/libs"
          # Rewriting load commands invalidates the code signature, and arm64
          # macOS refuses to start a binary whose signature does not match.
          find "${{ matrix.archive }}" -type f -exec codesign --force --sign - {} \; 2>/dev/null || true

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ matrix.archive }}" | Out-Null
          Copy-Item target\release\focusweave.exe "${{ matrix.archive }}\"
          Copy-Item "${{ steps.opencv.outputs.lib-dir }}\opencv_world*.dll" "${{ matrix.archive }}\"

      # Run the bundle from a directory the build environment does not reach
      # into, so a missing library fails here rather than for whoever downloads
      # it. pillow writes the test frames; nothing in this step provides OpenCV.
      - name: Smoke test
        shell: bash
        run: |
          [ "$RUNNER_OS" = "Windows" ] && exe=".exe" || exe=""
          pip install numpy pillow
          python ci/make_smoke_stack.py smoke-frames
          mv "${{ matrix.archive }}" "$HOME/bundle-under-test"
          "$HOME/bundle-under-test/focusweave$exe" smoke-frames --output smoke.png
          python -c "
          from PIL import Image
          im = Image.open('smoke.png')
          assert im.size[0] >= 320 and im.size[1] >= 240, im.size
          print('stacked', im.size, im.mode)
          "
          mv "$HOME/bundle-under-test" "${{ matrix.archive }}"

      - name: Archive
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${{ matrix.archive }}.zip" "${{ matrix.archive }}"
          else
            tar czf "${{ matrix.archive }}.tar.gz" "${{ matrix.archive }}"
          fi
          ls -l ${{ matrix.archive }}.*

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.zip
            ${{ matrix.archive }}.tar.gz
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            ${{ matrix.archive }}.zip
            ${{ matrix.archive }}.tar.gz

  wheels:
    name: Wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-opencv
        id: opencv

      - run: pip install maturin

      # No manylinux container: it has no OpenCV. The Linux wheel is therefore
      # tagged for the runner's glibc rather than being broadly portable.
      - run: maturin build --release --out dist

      # maturin repairs Linux wheels itself. The other two need their OpenCV
      # copied in by hand, or the wheel imports only on a machine that already
      # has the library the build linked against.
      - name: Repair (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pip install delvewheel
          delvewheel repair --add-path "${{ steps.opencv.outputs.lib-dir }}" -w repaired dist/*.whl
          rm -rf dist && mv repaired dist

      - name: Repair (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install delocate
          delocate-wheel -w repaired -v dist/*.whl
          rm -rf dist && mv repaired dist

      # A venv the build environment has not touched: if a library is missing
      # from the wheel, the import fails here.
      - name: Smoke test
        shell: bash
        run: |
          python -m venv "$HOME/clean"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$HOME/clean/Scripts"; exe=".exe"; else bin="$HOME/clean/bin"; exe=""; fi
          "$bin/pip" install numpy pillow
          # --no-index so the wheel under test is the one installed, never a
          # release from PyPI; its dependencies are already in place above.
          "$bin/pip" install --no-index --find-links dist focusweave
          "$bin/python" ci/make_smoke_stack.py smoke-frames
          "$bin/python" -c "
          from pathlib import Path
          import focusweave
          from focusweave import FocusStackConfig, run
          result = run(FocusStackConfig(images=Path('smoke-frames')))
          print('api ok', result.image.shape, result.image.dtype)
          "
          "$bin/focusweave$exe" smoke-frames --output cli.png
          ls -l dist cli.png

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: dist
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/*
