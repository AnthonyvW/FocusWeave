name: Build

on:
  release:
    types: [published]
  push:
    branches: [main, rust]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  opencv-backend:
    name: OpenCV backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev libclang-dev
      - run: pip install -r tests/requirements.txt
      - run: cargo test -p focusweave-core --features opencv-backend
      - run: cargo build --release -p focusweave-cli --features opencv-backend
      - name: Compare the OpenCV build against the reference
        run: FOCUSWEAVE_BIN=$PWD/target/release/focusweave python tests/compare_pipeline.py

  compare:
    name: Compare against the reference implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt maturin
      - run: cargo build --release -p focusweave-cli
      - run: maturin build --release --out dist
      - run: pip install --find-links dist --force-reinstall focusweave
      - run: python tests/run_all.py

  binaries:
    name: Binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: FocusWeave-linux
            built: target/release/focusweave
            release_name: FocusWeave-linux
          - os: windows-latest
            artifact: FocusWeave-windows
            built: target/release/focusweave.exe
            release_name: FocusWeave-windows.exe
          - os: macos-latest
            artifact: FocusWeave-macos
            built: target/release/focusweave
            release_name: FocusWeave-macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p focusweave-cli
      - name: Name the artifact for release
        shell: bash
        run: |
          mkdir -p upload
          cp "${{ matrix.built }}" "upload/${{ matrix.release_name }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: upload/${{ matrix.release_name }}
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: upload/${{ matrix.release_name }}

  wheels:
    name: Wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: dist
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/*
