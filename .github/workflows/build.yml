name: Build

on:
  release:
    types: [published]
  push:
    branches: [main, rust]
  pull_request:
  workflow_dispatch:

env:
  OPENCV_VERSION: "4.10.0"

jobs:
  # Populates the OpenCV cache once per platform so the jobs below restore it
  # rather than each building their own copy.
  opencv:
    name: OpenCV (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-opencv
        with:
          version: ${{ env.OPENCV_VERSION }}

  # Lints, unit tests and the comparison against the original Python
  # implementation, in one job: they share a checkout, an OpenCV restore and a
  # runner, and splitting them bought nothing but a second runner's overhead.
  verify:
    name: Verify
    needs: opencv
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-opencv
        with:
          version: ${{ env.OPENCV_VERSION }}

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - run: pip install -r tests/requirements.txt maturin
      - run: cargo build --release -p focusweave-cli
      - run: maturin build --release --out dist
      - run: pip install --find-links dist --force-reinstall focusweave
      - run: python tests/run_all.py

  binaries:
    name: Binary (${{ matrix.os }})
    needs: opencv
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: FocusWeave-linux
          - os: windows-latest
            archive: FocusWeave-windows
          - os: macos-latest
            archive: FocusWeave-macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-opencv
        id: opencv
        with:
          version: ${{ env.OPENCV_VERSION }}

      - run: cargo build --release -p focusweave-cli

      # OpenCV is linked dynamically, so a bare executable will not start on a
      # machine without it. Each folder carries the two libraries beside the
      # binary; it is only two because the OpenCV built above has no LAPACK,
      # OpenBLAS or GL behind it.
      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          python ci/bundle_elf.py target/release/focusweave "${{ matrix.archive }}" \
            --search "${{ steps.opencv.outputs.lib-dir }}"

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          python ci/bundle_macho.py target/release/focusweave "${{ matrix.archive }}" \
            --search "${{ steps.opencv.outputs.lib-dir }}"

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ matrix.archive }}" | Out-Null
          Copy-Item target\release\focusweave.exe "${{ matrix.archive }}\"
          Copy-Item "${{ steps.opencv.outputs.lib-dir }}\opencv_*.dll" "${{ matrix.archive }}\"

      # The OpenCV install is moved out of the way first, and the bundle run
      # from a directory the build never touched. Without that, the rpath
      # pointing at the build machine's OpenCV resolves and the test passes on
      # a folder containing no libraries at all. pillow writes the frames;
      # nothing here provides OpenCV.
      - name: Smoke test
        shell: bash
        run: |
          trap 'mv "$HOME/opencv-hidden" "$HOME/opencv-min" 2>/dev/null || true' EXIT
          mv "$HOME/opencv-min" "$HOME/opencv-hidden"
          [ "$RUNNER_OS" = "Windows" ] && exe=".exe" || exe=""
          pip install numpy pillow
          python ci/make_smoke_stack.py smoke-frames
          mv "${{ matrix.archive }}" "$HOME/bundle-under-test"
          "$HOME/bundle-under-test/focusweave$exe" smoke-frames --output smoke.png
          python -c "
          from PIL import Image
          im = Image.open('smoke.png')
          assert im.size[0] >= 320 and im.size[1] >= 240, im.size
          print('stacked', im.size, im.mode)
          "
          mv "$HOME/bundle-under-test" "${{ matrix.archive }}"
          du -sh "${{ matrix.archive }}"

      # The folder itself, not an archive of it: upload-artifact zips whatever
      # it is given, and handing it a .zip produced a zip inside a zip.
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}/
          if-no-files-found: error

      # A release asset has to be a single file, so the archive is built only
      # when there is a release to attach it to.
      - name: Archive for release
        if: github.event_name == 'release'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${{ matrix.archive }}.zip" "${{ matrix.archive }}"
          else
            tar czf "${{ matrix.archive }}.tar.gz" "${{ matrix.archive }}"
          fi

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            ${{ matrix.archive }}.zip
            ${{ matrix.archive }}.tar.gz

  # Linux wheels build inside a manylinux container, so the result installs on
  # any distribution back to glibc 2.28 rather than only on one as new as the
  # runner. That means OpenCV has to be built in there too, since the image has
  # none -- which is why this is a separate job from the other two platforms.
  wheel-manylinux:
    name: Wheel (manylinux_2_28)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Installed into the workspace rather than the container's own
      # filesystem, which is the only part the host can see and cache.
      - uses: actions/cache@v6
        with:
          path: opencv-manylinux
          key: opencv-${{ env.OPENCV_VERSION }}-manylinux_2_28-${{ hashFiles('ci/build_opencv.py') }}

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: "2_28"
          # The version is substituted before the container starts rather than
          # read from the environment inside it, so nothing depends on which
          # variables the action forwards.
          before-script-linux: |
            dnf install -y clang-devel cmake
            # The image's system python is too old for this script; its own
            # interpreters are not.
            /opt/python/cp312-cp312/bin/python ci/build_opencv.py \
              --version "${{ env.OPENCV_VERSION }}" \
              --prefix "$(pwd)/opencv-manylinux" \
              --env-file /tmp/opencv.env
            set -a
            . /tmp/opencv.env
            set +a
            export LIBCLANG_PATH=/usr/lib64
            # The rpath is how the extension finds OpenCV before auditwheel
            # rewrites it; LD_LIBRARY_PATH is how auditwheel itself finds the
            # libraries to copy in, and does not depend on maturin keeping the
            # RUSTFLAGS we set here.
            export RUSTFLAGS="-C link-arg=-Wl,-rpath,${FOCUSWEAVE_OPENCV_LIB_DIR}"
            export LD_LIBRARY_PATH="${FOCUSWEAVE_OPENCV_LIB_DIR}:${LD_LIBRARY_PATH}"

      - name: Smoke test
        run: |
          trap 'mv opencv-hidden opencv-manylinux 2>/dev/null || true' EXIT
          mv opencv-manylinux opencv-hidden
          python -m venv "$HOME/clean"
          "$HOME/clean/bin/pip" install numpy pillow
          "$HOME/clean/bin/pip" install --no-index --find-links dist focusweave
          "$HOME/clean/bin/python" ci/make_smoke_stack.py smoke-frames
          "$HOME/clean/bin/python" -c "
          from pathlib import Path
          from focusweave import FocusStackConfig, run
          result = run(FocusStackConfig(images=Path('smoke-frames')))
          print('api ok', result.image.shape, result.image.dtype)
          "
          "$HOME/clean/bin/focusweave" smoke-frames --output cli.png
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-manylinux
          path: dist
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/*

  wheels:
    name: Wheel (${{ matrix.os }})
    needs: opencv
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-opencv
        id: opencv
        with:
          version: ${{ env.OPENCV_VERSION }}

      - run: pip install maturin
      - run: maturin build --release --out dist

      # maturin repairs neither of these: it left the macOS wheel at 1.3 MB
      # with no dylibs in it, and has no Windows equivalent at all.
      - name: Repair (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install delocate
          delocate-wheel -w repaired -v dist/*.whl
          rm -rf dist && mv repaired dist

      - name: Repair (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pip install delvewheel
          delvewheel repair --add-path "${{ steps.opencv.outputs.lib-dir }}" -w repaired dist/*.whl
          rm -rf dist && mv repaired dist

      # The OpenCV install is moved out of the way first, so the only copy of
      # it left is whatever the wheel carries. Without that the extension's
      # rpath finds the build machine's copy and the test passes on a wheel
      # that would not import anywhere else.
      - name: Smoke test
        shell: bash
        run: |
          trap 'mv "$HOME/opencv-hidden" "$HOME/opencv-min" 2>/dev/null || true' EXIT
          mv "$HOME/opencv-min" "$HOME/opencv-hidden"
          python -m venv "$HOME/clean"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$HOME/clean/Scripts"; exe=".exe"; else bin="$HOME/clean/bin"; exe=""; fi
          "$bin/pip" install numpy pillow
          # --no-index so the wheel under test is the one installed, never a
          # release from PyPI; its dependencies are already in place above.
          "$bin/pip" install --no-index --find-links dist focusweave
          "$bin/python" ci/make_smoke_stack.py smoke-frames
          "$bin/python" -c "
          from pathlib import Path
          from focusweave import FocusStackConfig, run
          result = run(FocusStackConfig(images=Path('smoke-frames')))
          print('api ok', result.image.shape, result.image.dtype)
          "
          "$bin/focusweave$exe" smoke-frames --output cli.png
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: dist
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/*
