name: Set up OpenCV
description: >
  Make a minimal OpenCV available and export everything the opencv crate needs
  to find it, building it on a cache miss. Outputs the directory holding the
  runtime libraries, for the steps that bundle them into an artifact.

inputs:
  version:
    description: OpenCV version to build
    default: "4.10.0"

outputs:
  lib-dir:
    description: Directory containing the OpenCV runtime libraries
    value: ${{ steps.report.outputs.lib-dir }}

runs:
  using: composite
  steps:
    - name: Install libclang (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libclang-dev patchelf

    - name: Install libclang (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm
        echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

    - name: Install libclang (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # The runner image already carries a newer LLVM than Chocolatey would
        # install, and asking for one anyway fails the whole command.
        if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
          choco install --no-progress -y llvm
        }
        "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

    - name: Cache OpenCV
      uses: actions/cache@v4
      with:
        path: ~/opencv-min
        key: opencv-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/build_opencv.py') }}

    - name: Build OpenCV if the cache missed, and export where it is
      shell: bash
      run: python ci/build_opencv.py --version "${{ inputs.version }}" --prefix ~/opencv-min --env-file "$GITHUB_ENV"

    - name: Report
      id: report
      shell: bash
      run: |
        echo "lib-dir=$FOCUSWEAVE_OPENCV_LIB_DIR" >> "$GITHUB_OUTPUT"
        echo "OpenCV runtime libraries: $FOCUSWEAVE_OPENCV_LIB_DIR"

        # The libraries are not on any system path, so what is built here has
        # to carry the way to find them. @executable_path and @loader_path
        # keep working once the libraries are copied next to the artifact;
        # bundle_elf.py replaces the Linux rpath with $ORIGIN for the same
        # reason. Windows needs none of this: it searches the directory the
        # executable is in.
        case "$RUNNER_OS" in
          Linux)
            echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$FOCUSWEAVE_OPENCV_LIB_DIR" >> "$GITHUB_ENV"
            ;;
          macOS)
            echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,@executable_path -C link-arg=-Wl,-rpath,@loader_path -C link-arg=-Wl,-rpath,$FOCUSWEAVE_OPENCV_LIB_DIR" >> "$GITHUB_ENV"
            ;;
        esac
